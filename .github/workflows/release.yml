name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build-rust:
    name: Build Rust Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: lensort
            artifact_name: lensort-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: lensort
            artifact_name: lensort-macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: lensort
            artifact_name: lensort-macos-apple-silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: lensort.exe
            artifact_name: lensort-windows-x64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Release
        run: |
          cd rust_engine
          cargo build --release --target ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: rust_engine/target/${{ matrix.target }}/release/${{ matrix.binary_name }}

  release:
    needs: [build-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            lensort-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
